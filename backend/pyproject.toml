[project]
name = "crm-domani"
version = "0.1.0"
description = "CRM Domani (template) — API e sync Domani (Postgres/Supabase)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.9",
    "psycopg-pool>=3.2.0",
    "pyjwt>=2.10.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
