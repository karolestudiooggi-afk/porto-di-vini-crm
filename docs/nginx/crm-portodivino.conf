# CRM Porto Di Vino — site no nginx.
#
# Instalar em /etc/nginx/sites-available/crm-portodivino.conf, ligar em sites-enabled,
# conferir com `sudo nginx -t` e recarregar. O HTTPS (listen 443 e
# certificados) entra pelo certbot: sudo certbot --nginx -d crmportodivino.estudiodomaniai.com.br
#
#   /api/       -> API FastAPI (crm-portodivino-api.service, 127.0.0.1:8081), sem o prefixo
#   /           -> front Next.js (crm-portodivino-front.service, 127.0.0.1:3000)
#   /supabase/  -> só com Supabase self-hosted (gateway Kong), ver abaixo

server {
    listen 80;
    server_name crmportodivino.estudiodomaniai.com.br;

    # Importação de contatos e parceiros (até 10 MB) e de e-mails do monitor
    # de reputação (até 60 MB). O padrão do nginx (1 MB) recusa as duas.
    client_max_body_size 64m;

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase self-hosted no mesmo domínio (NEXT_PUBLIC_SUPABASE_URL =
    # https://crmportodivino.estudiodomaniai.com.br/supabase). Com Supabase na nuvem, deixe
    # comentado e use a URL do projeto. Ajuste a porta do Kong.
    # location /supabase/ {
    #     proxy_pass http://127.0.0.1:8000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
